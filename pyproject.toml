[tool.poetry]
name = "project"
version = "0.1.0"
description = ""
authors = ["Aleksei Sharypov"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.18"
psycopg2-binary = "^2.9.13"
pytz = "^2024.2"
whitenoise = "^6.12.0"
mcp = "^2.3.0"
django-oauth-toolkit = ">=3.4.1,<4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"

[tool.ruff]
target-version = "py313"
force-exclude = true
extend-exclude = [
    "manage.py",
    "project/asgi.py",
    "project/wsgi.py",
    "**/apps.py",
    "**/migrations/**",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
